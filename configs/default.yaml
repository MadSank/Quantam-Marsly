project_name: "mars_qcnn_terrain"

paths:
  manifest_path: "data/manifest.csv"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  runs_dir: "runs"
  results_dir: "results"

preprocessing:
  gsd_m: 0.5
  tile_px: 256
  train_stride_px: 128
  max_masked_fraction: 0.05
  slope_baselines_m: [5.0, 15.0]
  primary_baseline_m: 5.0
  hazard_slope_deg: 15.0
  safe_mean_slope_deg: 8.0
  safe_hazard_fraction: 0.05
  percentile_low: 2.0
  percentile_high: 98.0
  max_tiles_per_image: 1500
  stratify_quantiles: 10
  mars_radius_m: 3396190.0
  seam_gradient_multiplier: 6.0
  target_cols: ["mean_slope_5m", "roughness_m", "hazard_fraction"]
  log1p_targets: ["mean_slope_5m", "roughness_m", "hazard_fraction"]

features:
  use_sun_features: true

augmentation:
  enable_photometric: true
  brightness_jitter: 0.10
  contrast_jitter: 0.10
  gaussian_noise_std: 0.02
  enable_geometric: false

splits:
  n_splits: 5
  split_seed: 42

training:
  seeds: [0, 1, 2]
  epochs: 30
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 7
  num_workers: 0
  device: "cpu"

models:
  model1:
    pretrained: true
    backbone_dim: 512
    mlp_hidden: 128
    dropout: 0.1
    variants: ["resnet18"]
  model2:
    bottleneck_dim: 8
    n_qubits: 8
    n_conv_layers: 3
    mlp_control_hidden: 4
    perm_seed: 1337
    variants:
      - "qcnn"
      - "linear_control"
      - "mlp_control"
      - "no_entanglement_control"
      - "permuted_qubits_control"
  model3:
    downsample_px: 32
    patch_size: 2
    stride: 2
    n_qubits: 4
    n_random_layers: 2
    quanv_seed: 2026
    cnn_channels: [16, 32, 64]
    variants:
      - "quanv"
      - "classical_filter_control"
      - "plain_cnn_control"
  model4:
    downsample_px: 16
    base_qubits: 8
    sun_qubits: 2
    n_conv_layers: 3
    mlp_control_hidden: 32
    variants:
      - "pure_qcnn"
      - "tiny_cnn_control"
      - "mlp_control"

smoke:
  enabled: false
  n_synthetic_images: 5
  image_size_px: 640
  n_tiles_total: 200
  epochs: 2
  batch_size: 20
  seeds: [0]
  folds: [0]
