augmentation:
  brightness_jitter: 0.1
  contrast_jitter: 0.1
  enable_geometric: false
  enable_photometric: true
  gaussian_noise_std: 0.02
features:
  use_sun_features: true
models:
  model1:
    backbone_dim: 512
    dropout: 0.1
    mlp_hidden: 128
    pretrained: true
    variants:
    - resnet18
  model2:
    bottleneck_dim: 8
    mlp_control_hidden: 4
    n_conv_layers: 3
    n_qubits: 8
    perm_seed: 1337
    variants:
    - qcnn
    - linear_control
    - mlp_control
    - no_entanglement_control
    - permuted_qubits_control
  model3:
    cnn_channels:
    - 16
    - 32
    - 64
    downsample_px: 32
    n_qubits: 4
    n_random_layers: 2
    patch_size: 2
    quanv_seed: 2026
    stride: 2
    variants:
    - quanv
    - classical_filter_control
    - plain_cnn_control
  model4:
    base_qubits: 8
    downsample_px: 16
    mlp_control_hidden: 32
    n_conv_layers: 3
    sun_qubits: 2
    variants:
    - pure_qcnn
    - tiny_cnn_control
    - mlp_control
paths:
  cache_dir: data\cache\smoke
  manifest_path: data/manifest.csv
  processed_dir: data\processed\smoke
  raw_dir: data/raw
  results_dir: results\smoke
  runs_dir: runs\smoke
preprocessing:
  gsd_m: 0.5
  hazard_slope_deg: 15.0
  log1p_targets:
  - mean_slope_5m
  - roughness_m
  - hazard_fraction
  mars_radius_m: 3396190.0
  max_masked_fraction: 0.05
  max_tiles_per_image: 1500
  percentile_high: 98.0
  percentile_low: 2.0
  primary_baseline_m: 5.0
  safe_hazard_fraction: 0.05
  safe_mean_slope_deg: 8.0
  seam_gradient_multiplier: 6.0
  slope_baselines_m:
  - 5.0
  - 15.0
  stratify_quantiles: 10
  target_cols:
  - mean_slope_5m
  - roughness_m
  - hazard_fraction
  tile_px: 256
  train_stride_px: 128
project_name: mars_qcnn_terrain
smoke:
  batch_size: 20
  enabled: true
  epochs: 2
  folds:
  - 0
  image_size_px: 640
  n_synthetic_images: 5
  n_tiles_total: 200
  seeds: &id001
  - 0
splits:
  n_splits: 5
  split_seed: 42
training:
  batch_size: 20
  device: cpu
  early_stopping_patience: 7
  epochs: 2
  lr: 0.0001
  num_workers: 0
  seeds: *id001
  weight_decay: 0.0001
